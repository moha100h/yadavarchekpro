workflows:
  android-debug:
    name: Android Debug Build
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set gradlew executable
        script: chmod +x gradlew

      - name: Build debug APK
        script: ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - mmlu.tel@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release AAB
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
        - yadavarchek_keystore
    scripts:
      - name: Set gradlew executable
        script: chmod +x gradlew

      - name: Build release AAB
        script: ./gradlew bundleRelease --stacktrace

    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - mmlu.tel@gmail.com
        notify:
          success: true
          failure: true
