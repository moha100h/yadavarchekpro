[versions]
agp                  = "8.5.2"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.27"
hilt                 = "2.52"
compose-bom          = "2024.10.01"
navigation           = "2.8.4"
room                 = "2.6.1"
datastore            = "1.1.1"
workmanager          = "2.9.1"
coroutines           = "1.9.0"
lifecycle            = "2.8.7"
activity-compose     = "1.9.3"
core-ktx             = "1.15.0"
splashscreen         = "1.0.1"
biometric            = "1.2.0-alpha05"
vico                 = "2.0.0-beta.2"
jalaali              = "1.0.5"
accompanist          = "0.36.0"
coil                 = "2.7.0"
gson                 = "2.11.0"
apache-poi           = "5.3.0"
itextpdf             = "5.5.13.4"

[libraries]
# AndroidX Core
androidx-core-ktx              = { group = "androidx.core",            name = "core-ktx",                    version.ref = "core-ktx" }
androidx-lifecycle-runtime     = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose      = { group = "androidx.activity",        name = "activity-compose",            version.ref = "activity-compose" }
androidx-splashscreen          = { group = "androidx.core",            name = "core-splashscreen",           version.ref = "splashscreen" }
androidx-biometric             = { group = "androidx.biometric",       name = "biometric",                   version.ref = "biometric" }

# Compose BOM
compose-bom                    = { group = "androidx.compose",         name = "compose-bom",                 version.ref = "compose-bom" }
compose-ui                     = { group = "androidx.compose.ui",      name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui",      name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
compose-ui-tooling             = { group = "androidx.compose.ui",      name = "ui-tooling" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons         = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation              = { group = "androidx.compose.animation", name = "animation" }

# Navigation
navigation-compose             = { group = "androidx.navigation",      name = "navigation-compose",          version.ref = "navigation" }

# Room
room-runtime                   = { group = "androidx.room",            name = "room-runtime",                version.ref = "room" }
room-ktx                       = { group = "androidx.room",            name = "room-ktx",                    version.ref = "room" }
room-compiler                  = { group = "androidx.room",            name = "room-compiler",               version.ref = "room" }

# DataStore
datastore-preferences          = { group = "androidx.datastore",       name = "datastore-preferences",       version.ref = "datastore" }

# WorkManager
workmanager                    = { group = "androidx.work",            name = "work-runtime-ktx",            version.ref = "workmanager" }
hilt-work                      = { group = "androidx.hilt",            name = "hilt-work",                   version = "1.2.0" }
hilt-work-compiler             = { group = "androidx.hilt",            name = "hilt-compiler",               version = "1.2.0" }

# Hilt
hilt-android                   = { group = "com.google.dagger",        name = "hilt-android",                version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",        name = "hilt-android-compiler",       version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",            name = "hilt-navigation-compose",     version = "1.2.0" }

# Coroutines
coroutines-android             = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",  version.ref = "coroutines" }

# Charts
vico-compose-m3                = { group = "com.patrykandpatrick.vico", name = "compose-m3",                 version.ref = "vico" }

# Jalaali (Persian Calendar)
jalaali                        = { group = "com.github.samanzamani",   name = "PersianDate",                 version.ref = "jalaali" }

# Accompanist
accompanist-permissions        = { group = "com.google.accompanist",   name = "accompanist-permissions",     version.ref = "accompanist" }

# Coil
coil-compose                   = { group = "io.coil-kt",               name = "coil-compose",                version.ref = "coil" }

# Gson
gson                           = { group = "com.google.code.gson",     name = "gson",                        version.ref = "gson" }

# PDF & Excel
itextpdf                       = { group = "com.itextpdf",             name = "itextpdf",                    version.ref = "itextpdf" }
apache-poi                     = { group = "org.apache.poi",           name = "poi",                         version.ref = "apache-poi" }

[plugins]
android-application            = { id = "com.android.application",     version.ref = "agp" }
kotlin-android                 = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose                 = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                           = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                            = { id = "com.google.devtools.ksp",     version.ref = "ksp" }
